<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256">
  <title>NeProSto — соединение деревянных деталей</title>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="0.8" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#286157"/>
      <stop offset="0.52" stop-color="#164940"/>
      <stop offset="1" stop-color="#0b302e"/>
    </linearGradient>
    <linearGradient id="maple" x1="0" y1="0" x2="1" y2="0.85">
      <stop stop-color="#ffdea0"/>
      <stop offset="1" stop-color="#edb46d"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0.7" x2="1" y2="0">
      <stop stop-color="#9e5539"/>
      <stop offset="1" stop-color="#bf7950"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop stop-color="#062520" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#062520" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <path id="tile" fill="url(#forest)" d="M67 2h122c45 0 65 20 65 65v122c0 45-20 65-65 65H67c-45 0-65-20-65-65V67C2 22 22 2 67 2Z"/>
  <ellipse cx="130" cy="189" rx="89" ry="23" fill="url(#shadow)"/>

  <!-- Solid silhouette behind the three faces keeps their shared edges closed. -->
  <path fill="#daa06b" d="m42 83 22-12 69 32 52-31 26 12v77l-74 43-95-44Z"/>

  <!-- Long grain runs in each board's local plane. -->
  <g transform="matrix(1 0.46316 0 1 42 83)">
    <path fill="url(#maple)" d="M0 0h95v77H0z"/>
    <g fill="none" stroke="#c18147" stroke-linecap="round">
      <path opacity="0.61" stroke-width="1.45" d="M0 44c18 2 24-2 35-9s22-11 40-8"/>
      <path opacity="0.58" stroke-width="1.45" d="M9 49c16 0 29-13 42-13 6 0 10 2 15 2-8 1-14 5-20 7-8 3-14 2-23 4"/>
      <path opacity="0.45" stroke-width="1.2" d="M0 58c22 2 37-3 53-9 6-2 12-4 18-4"/>
    </g>
    <path fill="#ae6944" d="M69 19h26v18H69zM69 55h26v22H69z"/>
    <g stroke="#8b4e33" stroke-width="1.3" opacity="0.62" fill="none">
      <path d="M72 20q1 10 11 17m-5-17q1 8 10 14M72 56q7 3 10 14m-10-8q3 2 4 7"/>
    </g>
  </g>
  <g transform="matrix(1 -0.58108 0 1 137 127)">
    <path fill="url(#walnut)" d="M0 0h74v77H0z"/>
    <g fill="none" stroke="#814835" stroke-linecap="round">
      <path opacity="0.58" stroke-width="1.4" d="M33 51c15-7 22-6 41-5"/>
      <path opacity="0.45" stroke-width="1.25" d="M44 53c10-3 19-3 30-2"/>
    </g>
    <path fill="#eaae6c" d="M0 0h22v19H0zM0 37h22v18H0z"/>
    <path fill="none" stroke="#b57842" stroke-width="1.25" opacity="0.8"
          d="M3 0q0 9 9 17M9 0q0 6 5 10M3 38q9 4 11 16M3 44q4 2 5 7"/>
  </g>

  <!-- The top maple finger crosses the walnut board at the corner. -->
  <path fill="#ffe6af" d="m42 83 22-12 95 44-22 12Z"/>
  <path fill="#d89b6c" d="m133 103 52-31 26 12-52 31Z"/>
  <path fill="none" stroke="#fff1c9" stroke-width="1.15" d="m43 83 94 43.5 21-11.5"/>
</svg>
