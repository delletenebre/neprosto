name: neprosto
description: Настольный редактор для проектирования мебели и деревянных конструкций.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.4.0
  cupertino_ui: ^1.1.7
  cupertino_icons: ^1.0.8
  material_ui: ^1.1.0
  vector_math: ^2.2.0
  url_launcher: ^6.3.3
  file_selector: ^1.1.0
  shared_preferences: ^2.5.3
  excel: ^4.0.6
  phosphoricons_flutter: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/mark.svg
